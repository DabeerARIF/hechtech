<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Razer Viper Ultimate – 3D Model</title>
<style>
html,body{margin:0;height:100%;background:#050605;overflow:hidden;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#e8ffe8}
canvas{display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
#ui{position:fixed;left:16px;top:14px;pointer-events:none}
h1{margin:0;font-size:20px;letter-spacing:.18em;font-weight:600;color:#44d62c}
p{margin:4px 0 0;font-size:12px;opacity:.65;letter-spacing:.06em}
#bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:94%}
button{background:#0d130d;color:#cfeccb;border:1px solid #2a4a24;padding:8px 14px;border-radius:6px;font-size:12px;letter-spacing:.08em;cursor:pointer}
button:hover,button.on{background:#44d62c;color:#031003;border-color:#44d62c}
#pan{position:fixed;right:14px;top:14px;background:#0b110bcc;border:1px solid #2a4a24;border-radius:10px;padding:12px;font-size:11px;letter-spacing:.1em;width:150px}
#pan b{display:block;margin:8px 0 6px;color:#44d62c;font-weight:600}#pan b:first-child{margin-top:0}
.sw{display:flex;flex-wrap:wrap;gap:6px}.sw i{width:22px;height:22px;border-radius:50%;border:2px solid #333;cursor:pointer}.sw i.sel{border-color:#fff}
#pan input[type=color]{width:100%;height:26px;margin-top:6px;border:1px solid #2a4a24;background:none;padding:0;cursor:pointer}
</style></head><body>
<div id="ui"><h1>RAZER VIPER ULTIMATE</h1><p>Wireless ambidextrous-class esports mouse · drag to rotate · scroll to zoom</p></div>
<div id="pan"><b>BODY COLOR</b><div class="sw" id="bs"></div><input type="color" id="bc" value="#0c0d0c">
<b>ACCENT / GLOW</b><div class="sw" id="as"></div><input type="color" id="ac" value="#44d62c"><button id="cyc" style="margin-top:8px;width:100%">RGB CYCLE</button></div>
<div id="bar">
<button data-v="iso">ISO</button><button data-v="top">TOP</button><button data-v="side">SIDE</button><button data-v="front">FRONT</button><button data-v="bottom">UNDERSIDE</button>
<button id="rot" class="on">AUTO-ROTATE</button><button id="wire">WIREFRAME</button><button id="glow" class="on">CHROMA GLOW</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W=innerWidth,H=innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(W,H);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050605);scene.fog=new THREE.Fog(0x050605,300,700);
const cam=new THREE.PerspectiveCamera(35,W/H,1,2000);

// --- procedural environment map for reflections
const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d');
let gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#889488');gr.addColorStop(.5,'#1a201a');gr.addColorStop(1,'#050805');
g.fillStyle=gr;g.fillRect(0,0,512,256);g.fillStyle='#fff';g.fillRect(60,40,120,30);g.fillRect(320,60,160,18);
g.fillStyle='#44d62c';g.fillRect(250,100,10,100);
const envTex=new THREE.CanvasTexture(c);envTex.mapping=THREE.EquirectangularReflectionMapping;
const pm=new THREE.PMREMGenerator(renderer);const env=pm.fromEquirectangular(envTex).texture;scene.environment=env;

// --- lights
scene.add(new THREE.HemisphereLight(0xbfd8c0,0x050805,.5));
const key=new THREE.DirectionalLight(0xffffff,1.6);key.position.set(80,160,100);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-120,right:120,top:120,bottom:-120});scene.add(key);
const rim=new THREE.DirectionalLight(0x44d62c,1.4);rim.position.set(-120,60,-120);scene.add(rim);

// --- body shape mapping (mouse points to -Z, +Y up)
const L=127,HALF=L/2,BASE=4;
function prof(s){const bump=Math.exp(-Math.pow((s-.62)/.34,2));return{h:37*(.42+.58*bump),w:33*(.72+.28*Math.sqrt(Math.max(0,1-Math.pow((s-.58)/.72,2))))}}
function P(nx,ny,nz){const s=nz*.5+.5,p=prof(s);let x=nx*p.w;if(nx<0)x*=.93;
 const y=ny>=0?ny*p.h:ny*BASE;return new THREE.Vector3(x,y+BASE,nz*HALF)}
function sphereDir(a,b,nz){let v=new THREE.Vector3(a,b,nz);return v.normalize()}
const mouse=new THREE.Group();scene.add(mouse);

const bodyMat=new THREE.MeshPhysicalMaterial({color:0x0c0d0c,roughness:.42,metalness:.15,clearcoat:.35,clearcoatRoughness:.5});
const bg=new THREE.SphereGeometry(1,128,96);bg.rotateX(Math.PI/2);
const pos=bg.attributes.position;
for(let i=0;i<pos.count;i++){const v=P(pos.getX(i),pos.getY(i),pos.getZ(i));pos.setXYZ(i,v.x,v.y,v.z)}
bg.computeVertexNormals();
const body=new THREE.Mesh(bg,bodyMat);body.castShadow=body.receiveShadow=true;mouse.add(body);

// grip texture: subtle rubber sides (lighter band) via darker overlay lines
const lineMat=new THREE.MeshBasicMaterial({color:0x000000});
function surfLine(fn,n,r=.35,off=.12){const pts=[];for(let i=0;i<=n;i++){const v=fn(i/n);pts.push(v)}
 return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),n*2,r,6),lineMat)}
const topPt=(ux,nz)=>{const y=Math.sqrt(Math.max(0,1-nz*nz-ux*ux));const v=P(ux,y,nz);v.y+=.1;return v};
// button split + cross seam
mouse.add(surfLine(t=>topPt(0,-.98+t*(.98-.2)),60));
mouse.add(surfLine(t=>topPt(-.78+t*1.56,-.2)  ,60,.3));
// palm cover seam
mouse.add(surfLine(t=>{const a=-Math.PI/2+t*Math.PI;const x=Math.sin(a)*.66,z=.35+Math.cos(a)*.0+ -.0;return topPt(x,.1+.0*t)},50,.25));

// buttons' green accent edges
const gMat=new THREE.MeshBasicMaterial({color:0x44d62c});
// scroll wheel
const wsp=topPt(0,-.46),wheel=new THREE.Group();
const slot=new THREE.Mesh(new THREE.BoxGeometry(9,5,16),new THREE.MeshBasicMaterial({color:0}));slot.position.set(0,wsp.y-1.5,wsp.z);mouse.add(slot);
const wm=new THREE.Mesh(new THREE.CylinderGeometry(6.2,6.2,5.6,48),new THREE.MeshStandardMaterial({color:0x151615,roughness:.9}));wm.rotation.z=Math.PI/2;wheel.add(wm);
for(let i=0;i<24;i++){const r=new THREE.Mesh(new THREE.BoxGeometry(5.7,.6,1.2),new THREE.MeshStandardMaterial({color:0x2a2c2a,roughness:.8}));const a=i/24*Math.PI*2;r.position.set(0,Math.sin(a)*6.2,Math.cos(a)*6.2);r.rotation.x=-a;wheel.add(r)}
const ring=new THREE.Mesh(new THREE.CylinderGeometry(6.4,6.4,.5,48),gMat);ring.rotation.z=Math.PI/2;wheel.add(ring);
wheel.position.set(0,wsp.y-2.2,wsp.z);mouse.add(wheel);

// side buttons (left / thumb side)
[-.58,-.36].forEach(nz=>{const d=sphereDir(-1,.12,nz);const v=P(d.x,d.y,d.z);
 const b=new THREE.Mesh(new THREE.BoxGeometry(2.4,5,15),new THREE.MeshStandardMaterial({color:0x090909,roughness:.35,metalness:.3}));
 b.position.copy(v);b.position.x-=.2;b.rotation.y=-.12;b.castShadow=true;mouse.add(b);
 const l=new THREE.Mesh(new THREE.BoxGeometry(.4,.7,15.5),gMat);l.position.copy(b.position);l.position.x-=1.2;l.position.y-=2.4;mouse.add(l)});
// DPI button
const dpi=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.6,1,24),new THREE.MeshStandardMaterial({color:0x151515}));
dpi.position.copy(topPt(0,-.12));dpi.position.y-=.2;dpi.position.z=topPt(0,-.12).z;mouse.add(dpi);

// Razer-style logo on palm (canvas texture)
const lc=document.createElement('canvas');lc.width=lc.height=256;const lg=lc.getContext('2d');
lg.strokeStyle='#fff';lg.fillStyle='#fff';lg.lineWidth=14;lg.lineCap='round';lg.lineJoin='round';
lg.beginPath();lg.moveTo(60,200);lg.lineTo(100,60);lg.lineTo(170,60);lg.quadraticCurveTo(205,70,185,115);lg.lineTo(130,135);lg.lineTo(190,200);lg.stroke();
lg.beginPath();lg.moveTo(100,60);lg.lineTo(130,135);lg.lineTo(110,200);lg.stroke();
const logoTex=new THREE.CanvasTexture(lc);
const logoMat=new THREE.MeshBasicMaterial({map:logoTex,transparent:true,depthWrite:false});
const lp=topPt(0,.45);const logo=new THREE.Mesh(new THREE.PlaneGeometry(22,22),logoMat);
logo.position.set(0,lp.y+.4,lp.z);logo.rotation.x=-Math.PI/2-.12;mouse.add(logo);

// underside: PTFE feet, sensor, power switch, chroma strip
const sensorMat=new THREE.MeshStandardMaterial({color:0x44d62c,emissive:0x44d62c,emissiveIntensity:2});const sensor=new THREE.Mesh(new THREE.CylinderGeometry(4.5,4.5,.6,32),sensorMat);sensor.position.set(0,BASE-3.7,-8);mouse.add(sensor);
const sw=new THREE.Mesh(new THREE.BoxGeometry(10,.8,4),new THREE.MeshStandardMaterial({color:0x111511}));sw.position.set(0,BASE-3.8,18);mouse.add(sw);
// Chroma glow strip around base
const chroma=new THREE.Group();const strip=[];
for(let i=0;i<=120;i++){const a=i/120*Math.PI*2,nz=Math.cos(a),nx=Math.sin(a);const v=P(nx*.99,.06,nz*.99);strip.push(v)}
const cm=new THREE.MeshBasicMaterial({color:0x44d62c});
const tube=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(strip,true),240,.7,8,true),cm);chroma.add(tube);
const pl=new THREE.PointLight(0x44d62c,1.2,160);pl.position.set(0,-2,0);chroma.add(pl);mouse.add(chroma);

// floor
const floor=new THREE.Mesh(new THREE.CircleGeometry(400,64),new THREE.MeshStandardMaterial({color:0x0a0c0a,roughness:.6,metalness:.4}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(500,50,0x1d3a18,0x0f1d0d);grid.position.y=.05;scene.add(grid);
mouse.position.y=0;mouse.rotation.y=0;

// --- orbit controls (minimal)
let th=.7,ph=1.05,rad=260,tth=th,tph=ph,trad=rad,auto=true,drag=false,lx=0,ly=0;
const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;el.setPointerCapture(e.pointerId)});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag)return;tth-=(e.clientX-lx)*.008;tph=Math.min(Math.PI-.05,Math.max(.05,tph-(e.clientY-ly)*.008));lx=e.clientX;ly=e.clientY});
el.addEventListener('wheel',e=>{e.preventDefault();trad=Math.min(500,Math.max(90,trad*(1+e.deltaY*.001)))},{passive:false});
const views={iso:[.7,1.05],top:[0,.001+.02],side:[Math.PI/2,Math.PI/2],front:[Math.PI,Math.PI/2.2],bottom:[0,Math.PI-.02]};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{[tth,tph]=views[b.dataset.v];trad=b.dataset.v==='iso'?260:210;auto=false;rot.classList.remove('on')});
const rot=document.getElementById('rot');rot.onclick=()=>{auto=!auto;rot.classList.toggle('on',auto)};
document.getElementById('wire').onclick=e=>{bodyMat.wireframe=!bodyMat.wireframe;e.target.classList.toggle('on',bodyMat.wireframe)};
document.getElementById('glow').onclick=e=>{chroma.visible=!chroma.visible;e.target.classList.toggle('on',chroma.visible)};
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});


// --- color options
const accent=new THREE.Color(0x44d62c);let cycle=false;
function applyAccent(){gMat.color.copy(accent);sensorMat.color.copy(accent);sensorMat.emissive.copy(accent);cm.color.copy(accent);pl.color.copy(accent);rim.color.copy(accent);logoMat.color.copy(accent)}
const bodyCols=['#0c0d0c','#e8e8e8','#c0392b','#1f4fd8','#d6336c','#7b3fe4','#e67e22','#2f5d3a'];
const accCols=['#44d62c','#00e5ff','#ff2d55','#ff9f0a','#bf5af2','#ffffff','#ffe600'];
function mk(id,cols,fn,inp){const box=document.getElementById(id);cols.forEach((c,i)=>{const d=document.createElement('i');d.style.background=c;if(i===0)d.className='sel';
 d.onclick=()=>{box.querySelectorAll('i').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');document.getElementById(inp).value=c;fn(c)};box.appendChild(d)})}
mk('bs',bodyCols,c=>bodyMat.color.set(c),'bc');mk('as',accCols,c=>{cycle=false;cyc.classList.remove('on');accent.set(c);applyAccent()},'ac');
document.getElementById('bc').oninput=e=>bodyMat.color.set(e.target.value);
document.getElementById('ac').oninput=e=>{cycle=false;cyc.classList.remove('on');accent.set(e.target.value);applyAccent()};
const cyc=document.getElementById('cyc');cyc.onclick=()=>{cycle=!cycle;cyc.classList.toggle('on',cycle)};
applyAccent();
const target=new THREE.Vector3(0,14,0);const clock=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime();
 if(auto&&!drag)tth+=.004;
 th+=(tth-th)*.1;ph+=(tph-ph)*.1;rad+=(trad-rad)*.1;
 cam.position.set(target.x+rad*Math.sin(ph)*Math.sin(th),target.y+rad*Math.cos(ph),target.z+rad*Math.sin(ph)*Math.cos(th));cam.lookAt(target);
 wheel.rotation.x=Math.sin(t*1.2)*.6;
 if(cycle){accent.setHSL((t*.12)%1,.9,.5);applyAccent()}
 renderer.render(scene,cam)})();
</script></body></html>
